name: Paper or model-note correction
description: Correct metadata, interpretation, provenance, or a model-note field.
title: "[Paper]: "
body:
  - type: markdown
    attributes:
      value: "Cite the paper and explain the correction in your own words. Never upload the PDF, extracted full text, or page images. Source papers are outside the project's MIT license."
  - type: input
    id: identity
    attributes:
      label: DOI or Atlas paper ID
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Affected field and Atlas version
      description: Identify the note section, model variant, or catalog field and the release/commit or demo URL.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Current issue and proposed correction
      description: Explain the mismatch and proposed replacement in original prose. Keep uncertainty explicit.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source references
      description: Give page/section/equation identifiers and publisher or other authorized source links. Do not paste source passages or attach source files.
    validations:
      required: true
