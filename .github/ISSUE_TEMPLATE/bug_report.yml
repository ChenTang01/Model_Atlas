name: Bug report
description: Report a reproducible problem with Atlas or its public tooling.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use original explanations and redistributable examples. Do not attach paper PDFs, extracted full text, source-page images, or source-bearing logs. For a scholarly correction, use the paper correction form."
  - type: input
    id: version
    attributes:
      label: Atlas version or commit
      description: Include the page URL for the hosted demo, or the Git commit for a local checkout.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the query, Atlas paper ID/DOI, or command when relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Browser/OS, viewport, Node/Python versions if relevant, and concise reviewed error messages. State which checks ran.
    validations:
      required: true
