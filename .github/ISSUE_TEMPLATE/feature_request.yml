name: Feature or maintenance proposal
description: Propose a focused improvement with verifiable completion criteria.
title: "[Proposal]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe who encounters the problem and a concrete example.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Explain the resulting behavior and scope. Link related issues or roadmap work.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions or checks that establish completion.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Alternatives and constraints
      description: Note compatibility, accessibility, performance, source rights, or research validation concerns when relevant. Do not attach local-only paper material.
